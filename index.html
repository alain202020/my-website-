<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omar Hassan — Business IT Management</title>
  <meta name="description" content="Portfolio van Omar Hassan, student Business IT Management aan Hogeschool Inholland Amsterdam. Power BI, Power Apps, digitale transformatie en AI. Op zoek naar een stage in Amsterdam (februari – juni).">
  <meta name="theme-color" content="#06080d">
  <meta property="og:title" content="Omar Hassan — Business IT Management">
  <meta property="og:description" content="Power BI · Power Platform · Digitale transformatie · AI">
  <meta property="og:image" content="assets/omar.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
  <script>/* taal + leesrichting vóór het tekenen zetten (geen verspringing) */try{var l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang");if(l==="ar"||l==="en"){document.documentElement.lang=l;if(l==="ar")document.documentElement.dir="rtl";}}catch(e){}</script>
</head>
<body data-page="home">
  <main>
    <!-- 3D-HEADER -->
    <section class="hero">
      <canvas id="scene" data-variant="home" aria-hidden="true"></canvas>
      <div class="container hero-content">
        <span class="kicker fade-in" style="animation-delay:.3s"><span class="pulse"></span><span data-field="availability"></span></span>
        <h1>
          <span class="split"><span data-field="firstName"></span></span>
          <span class="split outline"><span data-field="lastName"></span></span>
        </h1>
        <p class="role fade-in" style="animation-delay:.7s">
          <span data-field="titleStart"></span> <span class="typed" id="typed"></span><span class="caret"></span>
        </p>
        <div class="hero-actions fade-in" style="animation-delay:.9s">
          <a href="contact.html" class="btn btn-primary" data-magnetic><span data-i18n="home.ctaContact"></span> <span class="arrow">→</span></a>
          <a href="projecten.html" class="btn btn-outline" data-magnetic data-i18n="home.ctaProjects"></a>
        </div>
      </div>
      <div class="scroll-hint"><span data-i18n="home.scroll"></span><i></i></div>
      <div class="drag-hint" data-i18n="home.drag"></div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <!-- KORTE INTRO -->
    <section class="block">
      <div class="container">
        <span class="label reveal"><b>01</b><span data-i18n="home.whoLabel"></span></span>
        <div class="intro-grid">
          <p class="big reveal" data-field="intro"></p>
          <div class="reveal">
            <div class="stats" id="stats" style="margin-top:0"></div>
            <p style="margin-top:24px"><a class="link-arrow" href="over-mij.html"><span data-i18n="home.moreAbout"></span> <span class="arrow">→</span></a></p>
          </div>
        </div>
      </div>
    </section>

    <!-- UITGELICHTE PROJECTEN -->
    <section class="block alt">
      <div class="container">
        <div class="sec-head">
          <div><span class="label reveal"><b>02</b><span data-i18n="home.featuredLabel"></span></span><h2 class="reveal" data-i18n-html="home.featuredTitle"></h2></div>
          <a class="link-arrow reveal" href="projecten.html"><span data-i18n="home.allProjects"></span> <span class="arrow">→</span></a>
        </div>
        <div class="projects" id="projects" data-featured></div>
      </div>
    </section>

    <!-- NAVIGATIETEGELS -->
    <section class="block">
      <div class="container">
        <div class="sec-head">
          <div><span class="label reveal"><b>03</b><span data-i18n="home.exploreLabel"></span></span><h2 class="reveal" data-i18n-html="home.exploreTitle"></h2></div>
        </div>
        <div class="tiles">
          <a class="tile reveal" href="over-mij.html"><div class="tile-inner tiltable"><div class="glare"></div><span class="num">01</span><span class="go">→</span><div><h3 data-i18n="nav.over"></h3><p data-i18n="home.tileOver"></p></div></div></a>
          <a class="tile reveal" href="projecten.html" style="transition-delay:.08s"><div class="tile-inner tiltable"><div class="glare"></div><span class="num">02</span><span class="go">→</span><div><h3 data-i18n="nav.projecten"></h3><p data-i18n="home.tileProjecten"></p></div></div></a>
          <a class="tile reveal" href="vaardigheden.html" style="transition-delay:.16s"><div class="tile-inner tiltable"><div class="glare"></div><span class="num">03</span><span class="go">→</span><div><h3 data-i18n="nav.vaardigheden"></h3><p data-i18n="home.tileSkills"></p></div></div></a>
          <a class="tile reveal" href="contact.html" style="transition-delay:.24s"><div class="tile-inner tiltable"><div class="glare"></div><span class="num">04</span><span class="go">→</span><div><h3 data-i18n="nav.contact"></h3><p data-i18n="home.tileContact"></p></div></div></a>
        </div>
      </div>
    </section>
  </main>

  <!-- Projectdetails -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Sluiten">✕</button>
      <span class="p-num" id="modal-num"></span><h3 id="modal-title"></h3><div class="p-ctx" id="modal-ctx"></div>
      <p id="modal-text"></p><div class="p-tags" id="modal-tags"></div>
    </div>
  </div>

  <script src="assets/i18n/nl.js?v=5"></script>
  <script src="assets/i18n/en.js?v=5"></script>
  <script src="assets/i18n/ar.js?v=5"></script>
  <script src="assets/main.js?v=5"></script>
  <script type="module" src="assets/scene.js?v=5"></script>
</body>
</html>
